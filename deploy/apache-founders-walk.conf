# Only the page, the QR library and api.php are public. Settings and the database are not.
ServerTokens Prod
ServerSignature Off
<Directory /var/www/html>
    Options -Indexes
    AllowOverride None
</Directory>
<Directory /var/www/html/data>
    Require all denied
</Directory>
<FilesMatch "^(config\.php|.*\.sqlite.*|\.ht.*)$">
    Require all denied
</FilesMatch>
<IfModule mod_headers.c>
    Header always set X-Content-Type-Options nosniff
    Header always set Referrer-Policy strict-origin-when-cross-origin
</IfModule>
